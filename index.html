<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>High Performance Web 3D Game</title>
  <script src="./coi-serviceworker.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #111; color: #fff; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #ui { position: absolute; top: 16px; left: 16px; pointer-events: none; }
    h1 { margin: 0 0 8px 0; font-size: 20px; }
    p { margin: 0; font-size: 14px; opacity: 0.8; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>WebWorker Multi-thread 3D Demo</h1>
    <p>FPS: <span id="fps">0</span> | Objects: <span id="count">0</span></p>
  </div>
  <div id="canvas-container"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
